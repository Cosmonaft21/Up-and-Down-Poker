<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#243447"/>
      <stop offset="1" stop-color="#141c28"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0cf75"/>
      <stop offset="1" stop-color="#b8922e"/>
    </linearGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#4678be" stroke-opacity=".28" stroke-width="2"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>

  <!-- фон: сукно с золотой каймой -->
  <rect x="8" y="8" width="496" height="496" rx="108" fill="url(#bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="url(#gold)" stroke-width="8"/>

  <!-- лист с записью игры -->
  <g transform="rotate(-9 200 250)" filter="url(#shadow)">
    <rect x="70" y="92" width="250" height="310" rx="10" fill="#fbf8ef"/>
    <rect x="70" y="92" width="250" height="310" rx="10" fill="url(#grid)"/>
    <line x1="116" y1="92" x2="116" y2="402" stroke="#d64541" stroke-opacity=".7" stroke-width="4"/>
    <g fill="none" stroke="#1f3c88" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <!-- «1», «2», «3» на полях -->
      <path d="M90 140l8-6v28"/>
      <path d="M86 184q8-10 15-2t-15 22h17"/>
      <path d="M86 226q9-8 15-1t-7 12q14 2 6 14t-15 0"/>
      <!-- записи очков -->
      <!-- 50 -->
      <path d="M150 132h-16l-2 13q14-5 18 5t-4 12-14-1"/>
      <ellipse cx="170" cy="148" rx="9" ry="14"/>
      <!-- 20 -->
      <path d="M132 180q8-10 15-3t-15 24h17"/>
      <ellipse cx="170" cy="191" rx="9" ry="14"/>
      <!-- −300 -->
      <path d="M128 236h12"/>
      <path d="M148 224q9-8 15-1t-7 12q14 2 6 14t-15 0"/>
      <ellipse cx="184" cy="236" rx="8" ry="13"/>
      <ellipse cx="206" cy="236" rx="8" ry="13"/>
    </g>
    <path d="M128 280h176M128 288h176" stroke="#1f3c88" stroke-width="4"/>
  </g>

  <!-- веер карт -->
  <g filter="url(#shadow)">
    <g transform="rotate(-26 330 430) translate(-14 0)">
      <rect x="236" y="168" width="168" height="236" rx="18" fill="#f0ebe3" stroke="#d9d0c1" stroke-width="4"/>
      <path d="M320 312c-34-26-58-44-58-68 0-18 14-30 30-30 12 0 22 7 28 18 6-11 16-18 28-18 16 0 30 12 30 30 0 24-24 42-58 68z" fill="#c0392b"/>
    </g>
    <g transform="rotate(12 330 430) translate(4 0)">
      <rect x="262" y="176" width="168" height="236" rx="18" fill="#fffdf8" stroke="#d9d0c1" stroke-width="4"/>
      <path d="M346 222c-38 30-62 50-62 74 0 18 14 30 30 30 10 0 20-5 25-13-2 14-8 26-20 34h54c-12-8-18-20-20-34 5 8 15 13 25 13 16 0 30-12 30-30 0-24-24-44-62-74z" fill="#1a2332"/>
    </g>
  </g>

  <!-- карандаш -->
  <g transform="rotate(38 150 400)" filter="url(#shadow)">
    <rect x="66" y="382" width="190" height="34" rx="6" fill="url(#gold)"/>
    <rect x="66" y="382" width="190" height="11" rx="5" fill="#fff" fill-opacity=".25"/>
    <rect x="236" y="382" width="26" height="34" rx="4" fill="#c0392b"/>
    <path d="M66 382L22 399l44 17z" fill="#e9d3a8"/>
    <path d="M36 393.5L22 399l14 5.5z" fill="#1f3c88"/>
  </g>
</svg>
